name: CI

on:
  push:
    branches-ignore:
      - cpp-rewrite
      - refactor
    paths-ignore:
      - ".gitignore"
      - ".github/*"
      - "**.md"
      - "LICENSE"
      - "misc/**"
      - "res/**"
  workflow_dispatch:
  release:
    types:
      - released

defaults:
  run:
    shell: bash

env:
  VERSION: "1.0.0"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            channel: stable
            target: x86_64-unknown-linux-gnu
            target_name: linux-x64
            arch_name: x86_64
          - name: Windows x64
            os: windows-latest
            channel: stable
            target: x86_64-pc-windows-msvc
            target_name: windows-x64
            arch_name: x86_64
          - name: Windows x32
            os: windows-latest
            channel: stable
            target: i686-pc-windows-msvc
            target_name: windows-x32
            arch_name: i686
          - name: macOS x64 (Intel Macs)
            os: macos-latest
            channel: stable
            target: x86_64-apple-darwin
            target_name: mac-x64
            arch_name: x86_64
          - name: macOS ARM64 (M1 Macs)
            os: macos-latest
            channel: stable
            target: aarch64-apple-darwin
            target_name: mac-arm64
            arch_name: arm64

    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          sudo apt update
          sudo apt install libasound2-dev libudev-dev libgl1-mesa-dev \
            libxext-dev libwayland-dev libxkbcommon-dev libdecor-0-dev

      - name: Set version
        id: set_version
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "channel=stable" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" == "main" ]; then
            echo "version=${{ env.VERSION }}-$((${{ github.run_number }} + 654))" >> $GITHUB_OUTPUT
            echo "channel=nightly" >> $GITHUB_OUTPUT
          else
            echo "version=${{ env.VERSION }}-${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT
            echo "channel=nightly" >> $GITHUB_OUTPUT
          fi

      - name: Restore cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo
            ~/.rustup
            target
          key: ${{ matrix.target_name }}-cargo

      - name: Setup rust toolchain
        run: |
          rustup default ${{ matrix.channel }}
          rustup target add ${{ matrix.target }}

          rustc -vV
          cargo -vV

          if [ "${{ runner.os }}" == "macOS" ]; then
            cargo install cargo-bundle
          fi

      - name: Build
        run: |
          if [ -z "${{ steps.set_version.outputs.version }}" ]; then
            echo "version is not set"
            exit 1
          fi

          export DRS_BUILD_VERSION_OVERRIDE="${{ steps.set_version.outputs.version }}"

          mkdir release

          if [ "${{ runner.os }}" == "macOS" ]; then
            cp -a ./data-overlay/. ./release/data/
            CARGO_INCREMENTAL=1 cargo bundle --release --target ${{ matrix.target }}
            cp -a ./target/${{ matrix.target }}/release/bundle/osx/miserysmeditation.app release/miserysmeditation.app
            codesign -s - -f ./release/miserysmeditation.app/Contents/MacOS/miserysmeditation
            cd release
            zip -9r "miserysmeditation_mac-${{ matrix.arch_name }}.zip" miserysmeditation.app data
            rm -rf miserysmeditation.app data
            cd ..
          elif [ "${{ runner.os }}" == "Windows" ]; then
            CARGO_INCREMENTAL=1 cargo build --release --locked --bin miserysmeditation --target ${{ matrix.target }}
            cp ./target/${{ matrix.target }}/release/miserysmeditation.exe release/miserysmeditation.${{ matrix.arch_name }}.exe
            cp -a ./data-overlay/. ./release/data/
            powershell -NoLogo -NoProfile -Command "Compress-Archive -Path './release/*' -DestinationPath './release/miserysmeditation_windows-${{ matrix.arch_name }}.zip' -Force"
            rm -rf ./release/data ./release/miserysmeditation.${{ matrix.arch_name }}.exe
          elif [ "${{ runner.os }}" == "Linux" ]; then
            RUSTFLAGS="-C link-args=-s" CARGO_INCREMENTAL=1 cargo build --release --locked --bin miserysmeditation --target ${{ matrix.target }}
            cp -a ./target/${{ matrix.target }}/release/miserysmeditation release/miserysmeditation.${{ matrix.arch_name }}.elf
            cp -a ./data-overlay/. ./release/data/
            cd release
            zip -9r "miserysmeditation_linux-${{ matrix.arch_name }}.zip" miserysmeditation.${{ matrix.arch_name }}.elf data
            rm -f miserysmeditation.${{ matrix.arch_name }}.elf
            rm -rf data
            cd ..
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: miserysmeditation_${{ matrix.target_name }}
          path: ./release/*
          if-no-files-found: error

      - name: Save cache
        if: ${{ github.ref_name == 'main' || github.ref_type == 'tag' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo
            ~/.rustup
            target
          key: ${{ matrix.target_name }}-cargo

  build_android:
    name: Android build
    runs-on: ubuntu-latest
    env:
      APP_OUTPUTS_DIR: "drsandroid/app/build/outputs/apk/release"
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Android
            os: ubuntu-latest
            channel: stable
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Restore cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache
            ~/.cargo
            ~/.rustup
            ~/.gradle
            drsandroid/app/.cxx
            drsandroid/app/build
            drsandroid/target
          key: android-cargo

      - name: Setup rust toolchain
        run: |
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          rustc -vV
          cargo -vV

      - name: Install development kits
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install --package_file=drsandroid/app/packages.txt

      - name: Set version
        id: set_version
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "channel=stable" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" == "main" ]; then
            echo "version=${{ env.VERSION }}-$((${{ github.run_number }} + 654))" >> $GITHUB_OUTPUT
            echo "channel=nightly" >> $GITHUB_OUTPUT
          else
            echo "version=${{ env.VERSION }}-${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT
            echo "channel=nightly" >> $GITHUB_OUTPUT
          fi

      - name: Build
        run: |
          if [ -z "${{ steps.set_version.outputs.version }}" ]; then
            echo "version is not set"
            exit 1
          fi

          export DRS_BUILD_VERSION_OVERRIDE="${{ steps.set_version.outputs.version }}"

          cd drsandroid
          touch local.properties
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Prepare artifact
        run: |
          mkdir release
          mv $APP_OUTPUTS_DIR/app-release-unsigned.apk release/miserysmeditation.apk
          cp LICENSE ./release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: miserysmeditation_android
          path: ./release/*
          if-no-files-found: error

      - name: Save cache
        if: ${{ github.ref_name == 'main' || github.ref_type == 'tag' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache
            ~/.cargo
            ~/.rustup
            ~/.gradle
            drsandroid/app/.cxx
            drsandroid/app/build
            drsandroid/target
          key: android-cargo

  build_horizon:
    name: Horizon build
    runs-on: ubuntu-latest
    env:
      RUSTSWITCH_IMAGE: "ghcr.io/mrragtime/miserysmeditation-build-env:latest"
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Horizon
            os: ubuntu-latest
            channel: stable
    steps:
      - uses: actions/checkout@v7
      - name: Restore cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache
            ~/.cargo
            drshorizon/target
          key: horizon-cargo

      - name: Set version
        id: set_version
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "channel=stable" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" == "main" ]; then
            echo "version=${{ env.VERSION }}-$((${{ github.run_number }} + 654))" >> $GITHUB_OUTPUT
            echo "channel=nightly" >> $GITHUB_OUTPUT
          else
            echo "version=${{ env.VERSION }}-${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT
            echo "channel=nightly" >> $GITHUB_OUTPUT
          fi

      - name: Build
        run: |
          if [ -z "${{ steps.set_version.outputs.version }}" ]; then
            echo "version is not set"
            exit 1
          fi

          export DRS_BUILD_VERSION_OVERRIDE="${{ steps.set_version.outputs.version }}"
          export RUSTSWITCH_IMAGE="${{ env.RUSTSWITCH_IMAGE }}"

          cd drshorizon
          ./build.sh -r --ci --docker-mode compose

      - name: Prepare artifact
        run: |
          # Files generated by in the containers are owned by root
          sudo chown -R $USER drshorizon/target

          mkdir release
          mv drshorizon/target/aarch64-nintendo-switch/release/drshorizon.nro release/miserysmeditation.nro
          cp LICENSE ./release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: miserysmeditation_horizon
          path: ./release/*
          if-no-files-found: error

      - name: Save cache
        if: ${{ github.ref_name == 'main' || github.ref_type == 'tag' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache
            ~/.cargo
            drshorizon/target
          key: horizon-cargo

  update_metadata:
    name: Update metadata
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'main' || github.ref_type == 'tag' }}
    needs: [build, build_android, build_horizon]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: misc/ci
          sparse-checkout-cone-mode: false
      - name: Set version
        id: set_version
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "channel=stable" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" == "main" ]; then
            echo "version=${{ env.VERSION }}-$((${{ github.run_number }} + 654))" >> $GITHUB_OUTPUT
            echo "channel=nightly" >> $GITHUB_OUTPUT
          else
            echo "version=${{ env.VERSION }}-${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT
            echo "channel=nightly" >> $GITHUB_OUTPUT
          fi

          mkdir -p release-binaries

      - name: Validate outputs
        run: |
          # fail early if ${{ steps.set_version.outputs.* }} is not set
          if [ -z "${{ steps.set_version.outputs.channel }}" ]; then
            echo "channel is not set"
            exit 1
          fi
          if [ -z "${{ steps.set_version.outputs.version }}" ]; then
            echo "version is not set"
            exit 1
          fi

      # Windows x32 build
      - name: Download Windows x32 artifact
        if: ${{ needs.build.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: miserysmeditation_windows-x32
          path: temp-windows-x32

      - name: Process Windows x32 build
        if: ${{ needs.build.result == 'success' }}
        run: |
          cp ./temp-windows-x32/miserysmeditation_windows-i686.zip "./release-binaries/miserysmeditation_windows_${{ steps.set_version.outputs.version }}.i686.zip"

      # Windows x64 build
      - name: Download Windows x64 artifact
        if: ${{ needs.build.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: miserysmeditation_windows-x64
          path: temp-windows-x64

      - name: Process Windows x64 build
        if: ${{ needs.build.result == 'success' }}
        run: |
          cp ./temp-windows-x64/miserysmeditation_windows-x86_64.zip "./release-binaries/miserysmeditation_windows_${{ steps.set_version.outputs.version }}.x86_64.zip"

      # Linux x64 build
      - name: Download Linux x64 artifact
        if: ${{ needs.build.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: miserysmeditation_linux-x64
          path: temp-linux-x64

      - name: Process Linux x64 build
        if: ${{ needs.build.result == 'success' }}
        run: |
          cp ./temp-linux-x64/miserysmeditation_linux-x86_64.zip "./release-binaries/miserysmeditation_linux_${{ steps.set_version.outputs.version }}.x86_64.zip"

      # macOS x64 build
      - name: Download macOS x64 artifact
        if: ${{ needs.build.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: miserysmeditation_mac-x64
          path: temp-mac-x64

      - name: Process macOS x64 build
        if: ${{ needs.build.result == 'success' }}
        run: |
          cp ./temp-mac-x64/miserysmeditation_mac-x86_64.zip "./release-binaries/miserysmeditation_macos_${{ steps.set_version.outputs.version }}.x86_64.zip"

      # macOS ARM64 build
      - name: Download macOS ARM64 artifact
        if: ${{ needs.build.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: miserysmeditation_mac-arm64
          path: temp-mac-arm64

      - name: Process macOS ARM64 build
        if: ${{ needs.build.result == 'success' }}
        run: |
          cp ./temp-mac-arm64/miserysmeditation_mac-arm64.zip "./release-binaries/miserysmeditation_macos_${{ steps.set_version.outputs.version }}.arm64.zip"

      # Android build
      - name: Download Android artifact
        if: ${{ needs.build_android.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: miserysmeditation_android
          path: temp-android

      - name: Process Android build
        if: ${{ needs.build_android.result == 'success' }}
        run: |
          cp ./temp-android/miserysmeditation.apk "./release-binaries/miserysmeditation_android_${{ steps.set_version.outputs.version }}.universal.apk"

      # Horizon build
      - name: Download Horizon artifact
        if: ${{ needs.build_horizon.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: miserysmeditation_horizon
          path: temp-horizon

      - name: Process Horizon build
        if: ${{ needs.build_horizon.result == 'success' }}
        run: |
          cp ./temp-horizon/miserysmeditation.nro "./release-binaries/miserysmeditation_switch_${{ steps.set_version.outputs.version }}.arm64.nro"

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        if: ${{ github.ref_type == 'tag' }}
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: release-binaries/*
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
